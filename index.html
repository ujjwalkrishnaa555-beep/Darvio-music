<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Darvio - Music Connects Your Heart</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="logo">
        🎵 Darvio
    </div>

    <div class="profile">
        👤
    </div>
</header>


<div class="search-box">
    <input type="text" id="searchInput" placeholder="Search songs, artists...">
</div>


<section>
    <h2>🔥 Trending Now</h2>
    <div id="trendingSongs" class="song-container"></div>
</section>


<section>
    <h2>🎧 Made For You</h2>
    <div id="madeForYou" class="song-container"></div>
</section>


<div id="player">

    <img id="playerImage" src="">

    <div>
        <h3 id="playerTitle">Select Song</h3>
        <p id="playerArtist"></p>
    </div>

    <button id="playBtn">▶</button>

</div>


<nav>
    <div>🏠 Home</div>
    <div>🔍 Search</div>
    <div>📚 Library</div>
</nav>


<script src="script.js"></script>

</body>
</html>
